<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdullah Hasan Nayem | Portfolio</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  overflow-x:hidden;
}

.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  animation:fadeIn 2s ease;
}

.hero h1{
  font-size:3rem;
  letter-spacing:2px;
}

.hero span{
  color:#00d4ff;
}

.hero p{
  margin-top:10px;
  font-size:1.2rem;
  opacity:0.8;
}

.card{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  padding:30px;
  border-radius:15px;
  margin:20px auto;
  width:90%;
  max-width:500px;
  text-align:center;
  animation:slideUp 1.5s ease;
}

.card h2{
  margin-bottom:15px;
}

.card p{
  margin:8px 0;
}

a{
  color:#00d4ff;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}

footer{
  text-align:center;
  padding:20px;
  opacity:0.7;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes slideUp{
  from{
    transform:translateY(50px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}
</style>
</head>

<body>

<section class="hero">
  <h1>Hi, I'm <span>Abdullah Hasan Nayem</span></h1>
  <p>Student of Computer Science</p>
</section>

<div class="card">
  <h2>About Me</h2>
  <p><strong>Name:</strong> Abdullah Hasan Nayem</p>
  <p><strong>Location:</strong> Pabna, Bangladesh</p>
  <p><strong>Profession:</strong> Student of Computer Science</p>
</div>

<div class="card">
  <h2>Contact</h2>
  <p>Email:</p>
  <a href="mailto:abdullahhasannayem@gmail.com">
    abdullahhasannayem@gmail.com
  </a>
</div>

<footer>
  © 2026 Abdullah Hasan Nayem
</footer>

</body>
</html>
